services:
  digitalmate:
    build: .
    ports:
      - "4173:4173"
    environment:
      # Optional Orbit bridge. Leave unset for the fully local, account-free mode.
      ORBIT_GATEWAY_URL: ${ORBIT_GATEWAY_URL:-}
      ORBIT_TOKEN_FILE: ${ORBIT_TOKEN_FILE:-}
      ORBIT_BINDING_ID: ${ORBIT_BINDING_ID:-default}
      ORBIT_ALLOWED_ORIGINS: ${ORBIT_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
